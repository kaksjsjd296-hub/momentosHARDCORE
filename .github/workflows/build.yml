name: Build momentosHARDCORE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build
        run: gradle build --no-daemon

      - name: Upload jar (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: momentoshardcore-jar
          path: build/libs/momentoshardcore-*.jar

      - name: Publish Release with the .jar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: momentosHARDCORE build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: build/libs/momentoshardcore-*.jar
